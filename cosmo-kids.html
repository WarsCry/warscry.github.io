<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#17104a">
  <title>Cosmo Kids | Jeux sans pub</title>
  <link rel="icon" type="image/png" href="favicondanpc.png">
  <link rel="stylesheet" href="cosmo-kids.css?v=9">
</head>
<body data-theme="cosmos">
  <div class="space" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="topbar">
    <a class="home" href="index.html" aria-label="Retour au site">‹ <span id="homeLabel">Accueil</span></a>
    <div class="brand"><span id="brandIcon" class="planet">🪐</span><strong id="brandName">Cosmo Kids</strong></div>
    <div class="top-actions">
      <button id="themeButton" class="setting-button" type="button"><span id="themeIcon">🦄</span><b id="themeLabel">Mode Licorne</b></button>
      <button id="languageButton" class="setting-button language-button" type="button" aria-label="English">EN</button>
      <div class="score" aria-label="Étoiles gagnées"><span>⭐</span><b id="starCount">0</b></div>
    </div>
  </header>

  <main>
    <section id="menu" class="screen active" aria-labelledby="welcomeTitle">
      <div class="welcome">
        <div id="welcomeAvatar" class="alien" aria-hidden="true">👽</div>
        <div><p id="welcomeKicker" class="eyebrow">MISSION DES PETITS EXPLORATEURS</p><h1 id="welcomeTitle">Choisis un jeu!</h1><p id="welcomeText">Sans pub. Sans achat. Joue autant que tu veux.</p></div>
      </div>
      <div class="game-grid">
        <button class="game-card shapes" data-game="shapes"><span class="game-icon">🔷</span><span><b>Les formes</b><small>Trouve les paires</small></span><em>Jouer</em></button>
        <button class="game-card memory" data-game="memory"><span class="game-icon">🚀</span><span><b>Mémoire spatiale</b><small>De nouvelles cartes chaque fois</small></span><em>Jouer</em></button>
        <button class="game-card counting" data-game="counting"><span class="game-icon">⭐</span><span><b>Compte les étoiles</b><small>Choisis le bon nombre</small></span><em>Jouer</em></button>
        <button class="game-card pattern" data-game="pattern"><span class="game-icon">🛸</span><span><b>La suite magique</b><small>Quelle image vient après?</small></span><em>Jouer</em></button>
        <button class="game-card trace" data-game="trace"><span class="game-icon">✏️</span><span><b>Dessine avec moi</b><small>Repasse sur les modèles</small></span><em>Jouer</em></button>
        <button class="game-card paint" data-game="paint"><span class="game-icon">🎨</span><span><b>Peinture magique</b><small>Une grande page pour créer</small></span><em>Jouer</em></button>
        <button class="game-card story" data-game="story"><span class="game-icon">🌙</span><span><b>L’histoire du dodo</b><small>Écoute, choisis et continue l’aventure</small></span><em>Écouter</em></button>
      </div>
      <p id="parentNote" class="parent-note">💜 Conçu pour les petites mains — aucun lien caché dans les jeux.</p>
    </section>

    <section id="play" class="screen" aria-live="polite">
      <div class="play-head">
        <button id="backButton" class="round-button" aria-label="Retour aux jeux">‹</button>
        <div><p id="gameKicker" class="eyebrow"></p><h2 id="gameTitle"></h2></div>
        <button id="soundButton" class="round-button" aria-label="Activer ou désactiver les sons">🔊</button>
      </div>
      <div id="instruction" class="instruction"></div>
      <div id="encouragement" class="encouragement" aria-live="polite"></div>
      <div id="gameArea" class="game-area"></div>
      <button id="newRound" class="new-round hidden">Encore! 🔄</button>
    </section>
  </main>

  <div id="celebration" class="celebration" aria-hidden="true">
    <div class="confetti"></div>
    <div class="celebration-orbit" aria-hidden="true"><i>⭐</i><i>🚀</i><i>🌈</i><i>🪐</i></div>
    <div class="reward"><span id="rewardIcon">🌟</span><b id="rewardTitle">Bravo!</b><small id="rewardText">Une étoile pour toi!</small><em aria-hidden="true">👽</em></div>
  </div>
  <script src="cosmo-kids.js?v=10"></script>
</body>
</html>
